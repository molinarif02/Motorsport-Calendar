# Motorsport calendar - configuration
# =============================================================================
# Re-read before every run: edit, save, and the next run applies it (no restart).
# Check your edits offline with:   docker compose run --rm generator validate
# Full reference: docs/configuration.md
# =============================================================================

log_level: info                     # debug | info | warn | error | crit  (applied on the next run)
contact: you@example.com            # goes in the User-Agent; OpenStreetMap's policy requires a contact
geocoding: true                     # look up venue / WRC stage-start coordinates (cached forever)
stale_max_days: 14                  # a failing collector keeps serving its last good data this long;
                                    # 0 = no age limit, drop each season's data only when that season is over
# seasons: [2026, 2027]             # default: this year, plus next year from October onwards

output:
  filename: motorsport.ics
  calendar_name: Motorsport
  description: WEC, IMSA, WRC, GT World Challenge, 24H Series, GT Open, drift and Monza events
  display_timezone: Europe/Rome
  color: "#D7263D"                  # initial colour in Apple Calendar
  refresh_minutes: 60               # hint only; Apple uses the interval you choose when subscribing
  keep_past_days: 45                # past events kept in the feed
  alarm_minutes: 0                  # e.g. 15 = reminder before every qualifying and race

schedule:
  interval_minutes: 180             # normal cadence
  race_weekend_interval_minutes: 30 # used when a session starts within the window below
  race_weekend_window_hours: 72
  idle_refresh_hours: 12            # a source with nothing in the window is re-fetched at most this often
                                    # (cached data is reused in between; 0 = always fetch everything)

# -----------------------------------------------------------------------------
# Championships. `type` picks the data source:
#   motocal       any championship of the motorsport-calendar library - just set `provider`
#                 (list them: docker compose run --rm generator providers)
#   wrc           World Rally Championship, one event per special stage
#   creventic     Michelin 24H Series          imsa          IMSA WeatherTech
#   driftmasters  Drift Masters                formuladrift  Formula DRIFT
#   gtopen        International GT Open        tribe/jsonld  circuit event calendars
#   manual        hand-written sessions in manual.yaml
# Labels (series tag, championship, race type) come from built-in defaults; any key
# can be overridden. GT/circuit series keep only FP, QUALI and RACE (`session_types`).
# -----------------------------------------------------------------------------
collectors:
  wec:   {type: motocal, provider: wec}
  gtwce: {type: motocal, provider: gtwc-europe}
  wrc:
    type: wrc
    stage_window_minutes: 90        # first car -> roughly the last priority car
    include_shakedown: true
    # rally_timezones: {"Rally Name": "Area/City"}   # fallback zones when the API's is missing
  24h:
    type: creventic                 # Michelin 24H Series, from 24hseries.com
    merge_qualifying: true          # one "Qualifying (all classes)" instead of 9 class slots
  imsa:
    type: imsa                      # IMSA WeatherTech SportsCar Championship, from imsa.com
    # series_regex: "WeatherTech"   # which IMSA series' practice/qualifying rows to keep
  dm:
    type: driftmasters              # Drift Masters, from dm.gp (timetable + stream links per round)
  fd:
    type: formuladrift              # Formula DRIFT, from formulad.com
  gtopen:
    type: gtopen                    # International GT Open: calendar + next-race schedule PDF
    # skip_regex: "\\btest\\b"        # rounds to ignore (default: tests)
  manual:
    type: manual
    file: /config/manual.yaml       # anything without a collector, and one-off fixes

  # ---- more championships: set `enabled: true` to add them --------------------
  gtwca:  {type: motocal, provider: gtwc-america, enabled: false}
  gtwcas: {type: motocal, provider: gtwc-asia,    enabled: false}
  igtc:   {type: motocal, provider: igtc,         enabled: false}
  elms:   {type: motocal, provider: elms,         enabled: false}
  motogp: {type: motocal, provider: motogp,       enabled: false}
  moto2:  {type: motocal, provider: moto2,        enabled: false}
  moto3:  {type: motocal, provider: moto3,        enabled: false}
  f1:     {type: motocal, provider: formula1,     enabled: false}
  # Example of overriding labels / session filter:
  # motogp: {type: motocal, provider: motogp, series: MGP, session_types: [QUALI, RACE]}

# -----------------------------------------------------------------------------
# Tracked circuits. Anything from any series held at a tracked circuit gets the
# circuit's label (e.g. "Monza") and its exact coordinates. Adding a `calendar:`
# block also reads the circuit's own event list (`type: tribe` for WordPress
# event sites like Monza's, or `jsonld`) so events from championships you don't
# follow show up too.
#   match: words looked for in the event location / name (default: the key)
# -----------------------------------------------------------------------------
tracked_circuits:
  monza:
    label: Monza
    name: Autodromo Nazionale Monza
    match: [monza]
    tz: Europe/Rome
    geo: [45.6156, 9.2811]
    location: Autodromo Nazionale Monza, Viale di Vedano 5, Monza, Italy
    calendar:                       # monzanet.it publishes its events through a WordPress REST API
      type: tribe
      api: https://www.monzanet.it/wp-json/tribe/events/v1/events
      categories: [gare]            # races only (no tours, track days, tests, cycling)
      series: MONZA                 # tag for events not recognised by series_map
      series_map:                   # event title regex -> series tag (hidden when that series has sessions)
        "World Endurance|6 Hours of Monza": WEC
        "GT World Challenge": GTWCE
        "GT Open": GTOPEN
        "Formula 1|Gran Premio": F1

  # Label-only tracking (no scraping) is one block. Circuits whose website uses the same
  # WordPress plugin as Monza can get `calendar: {type: tribe, api: https://<site>/wp-json/tribe/events/v1/events}`.
  # imola:   {label: Imola,   match: [imola, enzo e dino ferrari], geo: [44.3439, 11.7167]}
  # mugello: {label: Mugello, match: [mugello], geo: [43.9975, 11.3719]}
  # misano:  {label: Misano,  match: [misano], geo: [43.9614, 12.6833]}
  # spa:     {label: Spa, match: [spa-francorchamps, spa francorchamps], tz: Europe/Brussels, geo: [50.4372, 5.9714]}

# -----------------------------------------------------------------------------
# Streaming links, per series tag. Rules are tried in order; the first that yields
# a link wins. `youtube:` finds the exact live video (needs YOUTUBE_API_KEY, falls
# through otherwise); `url:` is a fixed link. Optional `match:` filters by
# session_types / name_regex / event_regex. See docs/streaming.md.
# -----------------------------------------------------------------------------
streaming:
  youtube:
    lookahead_days: 7
    match_before_minutes: 75        # streams often start before the session
    match_after_minutes: 120
  series:
    WEC:
      - match: {name_regex: "^(FP ?1|FP ?2|Free Practice 1|Free Practice 2)"}
        url: https://plus.fiawec.com/en   # FIAWEC+, linked from fiawec.com
        label: FIAWEC+ (live timing; video from FP3)
      - url: https://plus.fiawec.com/en
        label: FIAWEC+
    WRC:
      - url: https://rally.tv
        label: Rally.TV
    GTWCE:                          # site links youtube.com/gtworld and its own Watch Live page
      - youtube: "@GTWorld"
        label: GT World (YouTube)
      - url: https://www.gt-world-challenge-europe.com/watch-live
        label: GT World Challenge Europe – Watch Live
    GTOPEN:                         # links from gtopen.gtsport.es
      - match: {session_types: [QUALI, RACE]}
        youtube: "@GTOPENseries"
        label: GT Open (YouTube)
      - match: {session_types: [QUALI, RACE]}
        url: https://www.youtube.com/@GTOPENseries/streams
        label: GT Open (YouTube)
      - url: https://gtsport.cronococa.com/
        label: GT Open live timing
    24H:                            # the site marks qualifying and race as streamed on YouTube
      - match: {session_types: [QUALI, RACE]}
        youtube: "user:24HSeries"   # channel linked from 24hseries.com
        label: 24H Series (YouTube)
      - match: {session_types: [QUALI, RACE]}
        url: https://www.youtube.com/user/24HSeries/streams
        label: 24H Series (YouTube)
      - url: https://livetiming.getraceresults.com/24hseries
        label: 24H Series live timing
    IMSA:                           # outside the US, imsa.com lists qualifying + race on YouTube and IMSA.TV
      - match: {session_types: [QUALI, RACE]}
        youtube: "@IMSAOfficial"    # site links youtube.com/IMSAOfficial
        label: IMSA (YouTube)
      - match: {session_types: [QUALI, RACE]}
        url: https://www.youtube.com/IMSAOfficial/streams
        label: IMSA (YouTube)
    DM:                             # the collector sets exact links from dm.gp; this is the fallback
      - match: {session_types: [QUALI]}
        url: https://www.youtube.com/@DriftMastersGrandPrix/streams
        label: Drift Masters (YouTube)
    FD:                             # the collector sets formulad.com/live from the schedule; fallback
      - match: {session_types: [QUALI, RACE]}
        url: https://www.formulad.com/live
        label: Formula DRIFT live
    # GTWCA / GTWCAS / IGTC share the GT World channel:
    # GTWCA: [{youtube: "@GTWorld", label: GT World (YouTube)}]
    # MotoGP: [{url: "<your broadcaster or VideoPass link>", label: MotoGP}]
