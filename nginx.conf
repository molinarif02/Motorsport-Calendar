# Static server for the feed: only /motorsport.ics and /status.json are exposed.
server {
    listen 8080;
    server_name _;
    root /www;
    server_tokens off;

    types { text/calendar ics; application/json json; }
    charset utf-8;
    gzip on;
    gzip_types text/calendar application/json;

    # only the feed and the status file are served
    location = /motorsport.ics {
        add_header Cache-Control "public, max-age=900";
        add_header Access-Control-Allow-Origin "*";
    }
    location = /status.json { add_header Cache-Control "no-cache"; }
    location / { return 404; }

    access_log off;
}
