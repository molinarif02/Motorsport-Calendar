# Static server for the feed: only /motorsport.ics, /status.json and /status.html are exposed.
server {
    listen 8080;
    server_name _;
    root /www;
    server_tokens off;
    absolute_redirect off;              # relative Location header: works behind the tunnel/proxy

    types { text/calendar ics; application/json json; text/html html; }
    charset utf-8;
    gzip on;
    gzip_types text/calendar application/json;

    # only the feed and the status files are served
    location = /motorsport.ics {
        add_header Cache-Control "public, max-age=900";
        add_header Access-Control-Allow-Origin "*";
    }
    location = /status.json { add_header Cache-Control "no-cache"; }
    location = /status.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'";
        add_header X-Content-Type-Options nosniff;
    }
    location = /status { return 302 /status.html; }
    location / { return 404; }

    access_log off;
}
