[project]
name = "mscal"
version = "1.3.0"
description = "Self-hosted motorsport calendar (WEC, WRC stages, GT, MotoGP, ...) published as one iCalendar feed"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Federico Molinari" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
# Minimums = the versions the test suite runs against; exact pins live in requirements.txt
dependencies = [
    "motorsport-calendar==0.3.0",
    "icalendar>=7.3,<8",
    "httpx>=0.28.1,<1",
    "PyYAML>=6.0.3",
    "beautifulsoup4>=4.15",
    "lxml>=6.1",
    "pypdf>=6.20,<7",
]

[project.urls]
Homepage = "https://github.com/molinarif02/Motorsport-Calendar"

[project.scripts]
mscal = "mscal.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mscal*"]

[tool.setuptools.package-data]
mscal = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
