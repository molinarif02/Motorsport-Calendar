[project]
name = "mscal"
version = "1.1.0"
description = "Self-hosted motorsport calendar (WEC, WRC stages, GT, MotoGP, ...) published as one iCalendar feed"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Federico Molinari" }]
requires-python = ">=3.12"
dependencies = [
    "motorsport-calendar==0.3.0",
    "icalendar>=6.1,<8",
    "httpx>=0.27",
    "PyYAML>=6",
    "pypdf>=4.2",
]

[project.urls]
Homepage = "https://github.com/molinarif02/Motorsport-Calendar"

[project.scripts]
mscal = "mscal.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mscal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
